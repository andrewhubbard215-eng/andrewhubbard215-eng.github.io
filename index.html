<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
  (function () {
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/19929303c1ba1e1a0a9063add9063123282320a2/index.html";
    function patch(html) {
      html = html.replace(/phone-p0\.css\?v=13/g, "phone-p0.css?v=14");
      html = html.replace(/v3\.5\.26[0-6]/g, "v3.5.267");
      html = html.replace(/sw\.js\?v=50[0-6]/g, "sw.js?v=507");
      html = html.replace(/clock-in-floor\.js\?v=4[6-8]/g, "clock-in-floor.js?v=48");
      html = html.replace(/analog-gauges\.js\?v=\d+/g, "analog-gauges.js?v=8");
      html = html.replace(/refrigerant-flow\.js\?v=\d+/g, "refrigerant-flow.js?v=2");
      html = html.replace(
        /Hook gauges - read SH\/SC - pick the fault/g,
        "Meter leads · airflow before charge · no jump safety"
      );
      if (html.indexOf("phone-gauges-233.css") === -1) {
        html = html.replace(
          '<link rel="stylesheet" href="phone-p0.css?v=14" />',
          '<link rel="stylesheet" href="phone-p0.css?v=14" />\n  <link rel="stylesheet" href="phone-gauges-233.css?v=2" />\n  <link rel="stylesheet" href="phone-gauges-clip-233.css?v=2" />'
        );
      }
      if (html.indexOf("theme-amber-bench.css") === -1) {
        html = html.replace(
          '</head>',
          '  <link rel="stylesheet" href="theme-amber-bench.css?v=2" />\n</head>'
        );
      } else {
        html = html.replace(/theme-amber-bench\.css\?v=\d+/g, "theme-amber-bench.css?v=2");
      }
      if (html.indexOf("service-meter.js") === -1) {
        html = html.replace(
          '<script src="recovery-room.js?v=1"><\/script>',
          '<script src="recovery-room.js?v=1"><\/script>\n  <script src="service-meter.js?v=1"><\/script>'
        );
      }
      if (html.indexOf("refrigerant-flow.js") === -1) {
        html = html.replace(
          '<script src="analog-gauges.js?v=8"><\/script>',
          '<script src="analog-gauges.js?v=8"><\/script>\n  <script src="refrigerant-flow.js?v=2"><\/script>'
        );
      }
      if (html.indexOf('href="/desk/"') === -1) {
        html = html.replace(
          '<button class="mode-card" data-mode="rapture"',
          '<a class="mode-card" href="/desk/" id="hub-desk-door"><h3>Instructor Desk</h3><p>Separate door — students stay on the shop floor</p></a>\n        <button class="mode-card" data-mode="rapture"'
        );
      }
      return html;
    }
    fetch(SRC, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("boot fetch " + r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(patch(html));
        document.close();
      })
      .catch(function (e) {
        document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - v3.5.267 - shop floor</p>";
      });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=507").catch(function () {});
  })();
  </script>
</head>
<body>
  <p style="font:16px/1.4 sans-serif;padding:24px;color:#f4e7c8;background:#0c0a07;min-height:80vh">Loading HVAC Allstars shop floor…</p>
  <p class="version-strip">HVAC Allstars - v3.5.267 - shop floor</p>
</body>
</html>
