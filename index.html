<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script>
  (function () {
    var APP_VER = "v3.5.640"; /* ONE version source: every footer reads <meta name="lt-app-ver"> */
    window.LT_APP_VER = APP_VER;
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/d692237427c4a0b4a443a94141eb568d40364d02/index.html";
    function patch(html) {
      html = html.replace(/sandbox-eq\.js\?v=\d+/g, "sandbox-eq.js?v=10");
      html = html.replace(/sandbox-ts\.js\?v=\d+/g, "sandbox-ts.js?v=25");
      html = html.replace(/sw\.js\?v=\d+/g, "sw.js?v=886");
      html = html.replace(/shop-floor-copy\.js\?v=\d+/g, "shop-floor-copy.js?v=215");
      html = html.replace(/sandbox-seats\.js\?v=\d+/g, "sandbox-seats.js?v=34");
      html = html.replace(/sandbox-poster\.js\?v=\d+/g, "sandbox-poster.js?v=3");
      html = html.replace(/sandbox-hunt\.js\?v=\d+/g, "sandbox-hunt.js?v=6");
      html = html.replace(/sandbox-hook\.js\?v=\d+/g, "sandbox-hook.js?v=19");
      html = html.replace(/sandbox-packs\.js\?v=\d+/g, "sandbox-packs.js?v=3");
      html = html.replace(/sandbox-yell\.js\?v=\d+/g, "sandbox-yell.js?v=6");
      html = html.replace(/lugs-lock\.js\?v=\d+/g, "lugs-lock.js?v=2");
      html = html.replace(/clock-in-form\.js\?v=\d+/g, "clock-in-form.js?v=32");
      html = html.replace(/clock-in-floor\.js\?v=\d+/g, "clock-in-floor.js?v=48");
      html = html.replace(/sandbox-cutout\.js\?v=\d+/g, "sandbox-cutout.js?v=9");
      html = html.replace(/sandbox-td\.js\?v=\d+/g, "sandbox-td.js?v=8");
      html = html.replace(/analog-gauges\.js\?v=\d+/g, "analog-gauges.js?v=13");
      html = html.replace(/nocool-lock\.js\?v=\d+/g, "nocool-lock.js?v=3");
      html = html.replace(/saturday-arm\.js\?v=\d+/g, "saturday-arm.js?v=3");
      html = html.replace(/electrical\.js\?v=\d+/g, "electrical.js?v=139");
      html = html.replace(/electrical-sheet\.js\?v=\d+/g, "electrical-sheet.js?v=27");
      html = html.replace(/board-codes\.js\?v=\d+/g, "board-codes.js?v=20");
      html = html.replace(/furnace-soo-floor\.js\?v=\d+/g, "furnace-soo-floor.js?v=4");
      html = html.replace(/voltmeter-school\.js\?v=\d+/g, "voltmeter-school.js?v=11");
      html = html.replace(/minisplit\.js\?v=\d+/g, "minisplit.js?v=11");
      html = html.replace(/minisplit-phone\.js\?v=\d+/g, "minisplit-phone.js?v=5");
      html = html.replace(/bay-restore\.js\?v=\d+/g, "bay-restore.js?v=2");
      html = html.replace(/route-park\.js\?v=\d+/g, "route-park.js?v=3");
      html = html.replace(/route-floor\.js\?v=\d+/g, "route-floor.js?v=24");
      html = html.replace(/service\.js\?v=\d+/g, "service.js?v=113");
      html = html.replace(/exam-cutout\.js\?v=\d+/g, "exam-cutout.js?v=18");
      html = html.replace(/recovery-room\.js\?v=\d+/g, "recovery-room.js?v=7");
      html = html.replace(/sandbox-layout\.css\?v=\d+/g, "sandbox-layout.css?v=44");
      html = html.replace(/sandbox-pc\.css\?v=\d+/g, "sandbox-pc.css?v=12");
      html = html.replace(/phone-floor\.css\?v=\d+/g, "phone-floor.css?v=49");
      html = html.replace(/phone-p0\.css\?v=\d+/g, "phone-p0.css?v=14");
      html = html.replace(/phone-rail\.css\?v=\d+/g, "phone-rail.css?v=7");
      html = html.replace(/saturday-phone\.css\?v=\d+/g, "saturday-phone.css?v=4");
      html = html.replace(/v3\.5\.\d+/g, APP_VER);
      html = html.replace("Live SH/SC - HPC/LPC cut out - parts LEFT", "Live SH/SC targets \u00b7 HPC/LPC cutout \u00b7 parts LEFT \u00b7 equalized = do not recover");
      return html;
    }
    fetch(SRC, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("boot fetch " + r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(patch(html));
        document.close();
      })
      .catch(function (e) {
        document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - " + APP_VER + " - shop floor</p>";
      });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=886").catch(function () {});
  })();
  </script>
</head>
<body>
  <p style="font:16px/1.4 sans-serif;padding:24px;color:#f4e7c8;background:#0c0a07;min-height:80vh">Loading HVAC Allstars shop floor\u2026</p>
  <p class="version-strip">HVAC Allstars - v3.5.640 - shop floor</p>
</body>
</html>
