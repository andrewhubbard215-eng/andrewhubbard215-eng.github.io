name: restore-hub-ai
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-hub-ai.yml
      - .github/hub-restore/apply_hub_locks.py
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply teaching-lock patches to hub-ai.js
        run: |
          python3 .github/hub-restore/apply_hub_locks.py
      - name: Commit hub-ai.js
        run: |
          git config user.name "andrewhubbard215-eng"
          git config user.email "andrewhubbard215@gmail.com"
          git add hub-ai.js
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "Allstars teaching lock: hub-ai.js source — dew/boiling, fingerprints, dirty condenser SC~normal, TXV seat"
          git push
