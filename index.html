<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0a07" />
  <title>Lincoln Tech HVAC Allstars</title>
  <script>
    var APP_VER = "v3.5.502"; /* ONE version source: every footer reads <meta name="lt-app-ver"> */
    window.LT_APP_VER = APP_VER;
    (function () {
      var boot = document.currentScript;
      function load(url) {
        return fetch(url, { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error(url + " " + r.status);
          return r.text();
        });
      }
      function inject(html) {
        html = html.replace(/v3\.5\.\d+/g, APP_VER);
        html = html.replace("<head>", '<head>\n  <meta name="lt-app-ver" content="' + APP_VER + '" />');
        document.open();
        document.write(html);
        document.close();
      }
      load("game.html?v=" + APP_VER)
        .then(inject)
        .catch(function (e) {
          document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - " + APP_VER + " - shop floor</p>";
        });
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js?v=748").catch(function () {});
    })();
  </script>
</head>
<body>
  <p style="font:16px/1.4 sans-serif;padding:24px;color:#f4e7c8;background:#0c0a07;min-height:80vh">Loading HVAC Allstars shop floor…</p>
  <p class="version-strip">HVAC Allstars - v3.5.502 - shop floor</p>
</body>
</html>
