<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script>
  (function () {
    var APP_VER = "v3.5.858"; /* ONE version source: every footer reads <meta name="lt-app-ver"> */
    window.LT_APP_VER = APP_VER;
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/015e4eafa4bc2ab80dfbea157aa10fad84541f42/index.html";
    function patch(html) {
      html = html.replace(/sandbox-eq\.js\?v=\d+/g, "sandbox-eq.js?v=20");
      html = html.replace(/sandbox-ts\.js\?v=\d+/g, "sandbox-ts.js?v=33");
      html = html.replace(/sw\.js\?v=\d+/g, "sw.js?v=1106");
      html = html.replace(/shop-floor-copy\.js\?v=\d+/g, "shop-floor-copy.js?v=302");
      html = html.replace(/sandbox-seats\.js\?v=\d+/g, "sandbox-seats.js?v=39");
      html = html.replace(/sandbox-poster\.js\?v=\d+/g, "sandbox-poster.js?v=3");
      html = html.replace(/sandbox-hunt\.js\?v=\d+/g, "sandbox-hunt.js?v=6");
      html = html.replace(/sandbox-hook\.js\?v=\d+/g, "sandbox-hook.js?v=19");
      html = html.replace(/sandbox-packs\.js\?v=\d+/g, "sandbox-packs.js?v=3");
      html = html.replace(/sandbox-yell\.js\?v=\d+/g, "sandbox-yell.js?v=6");
      html = html.replace(/lugs-lock\.js\?v=\d+/g, "lugs-lock.js?v=2");
      html = html.replace(/clock-in-form\.js\?v=\d+/g, "clock-in-form.js?v=32");
      html = html.replace(/clock-in-floor\.js\?v=\d+/g, "clock-in-floor.js?v=48");
      html = html.replace(/sandbox-cutout\.js\?v=\d+/g, "sandbox-cutout.js?v=9");
      html = html.replace(/sandbox-td\.js\?v=\d+/g, "sandbox-td.js?v=8");
      html = html.replace(/analog-gauges\.js\?v=\d+/g, "analog-gauges.js?v=27");
      html = html.replace(/exam-whywrong\.js\?v=\d+/g, "exam-whywrong.js?v=3");
      html = html.replace(/v3\.5\.\d+/g, APP_VER);
      html = html.replace(/HVAC Allstars - v3\.5\.\d+ - shop floor/g, "HVAC Allstars - " + APP_VER + " - shop floor \u00b7 Equalized = do not recover");
      return html;
    }
    function boot() {
      fetch(SRC).then(function (r) { return r.text(); }).then(function (html) {
        html = patch(html);
        document.open();
        document.write(html);
        document.close();
      }).catch(function (e) {
        document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - " + APP_VER + " - shop floor \u00b7 Equalized = do not recover</p>";
      });
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=1106").catch(function () {});
    boot();
  })();
  </script>
</head>
<body>
  <p style="font:14px monospace;padding:24px;color:#1BFF80;background:#0c0a07;min-height:80vh">Loading HVAC Allstars shop floor… Equalized = do not recover. Parts LEFT. Meter / LOTO 24V first.</p>
  <p class="version-strip">HVAC Allstars - v3.5.858 - shop floor · Equalized = do not recover</p>
</body>
</html>
