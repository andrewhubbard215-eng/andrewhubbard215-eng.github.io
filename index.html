<body>
  <div id="app">
    <section id="screen-title" class="screen active">
      <div class="bg-plate bg-lincoln" style="background-image:url(lincoln-tech.jpg)"></div>
      <div class="title-hero">
        <img src="hub-portrait.jpg" alt="Professor HUB" class="title-hero-face" />
        <p class="eyebrow"><span class="lincoln-only">Lincoln Tech - HVAC</span><span class="store-only">Vocational HVAC trainer</span></p>
        <h1>HVAC <span class="lt-red">Allstars</span></h1>
        <p class="lede">Clock In — shop floor.</p>
        <button class="btn primary btn-clock-hero" id="btn-start" type="button">Clock In</button>
      </div>
    </section>
    <section id="screen-hub" class="screen">
      <header class="hub-head">
        <img src="hub-portrait.jpg" alt="Professor HUB" class="hub-avatar" />
        <h2 id="hub-name">Tech</h2>
        <p class="hub-wallet" id="hub-wallet"><span id="hub-rank">Helper</span> - <span id="hub-cash">$0</span> - <span id="hub-jobs">0 jobs</span> - <span id="hub-xp">0 XP</span></p>
        <button type="button" class="btn" id="hub-locker">Locker</button>
        <button type="button" class="btn" data-hubai-toggle>HUB AI - On</button>
      </header>
      <div id="daily-root"></div>
      <div class="hub-grid hub-nav" id="hub-options">
        <button class="mode-card mode-card-hero" data-mode="sandbox" type="button"><h3>System sandbox</h3><p>Live SH/SC - HPC/LPC cut out - parts LEFT</p></button>
        <button class="mode-card mode-card-hero" data-mode="truck-pouch" type="button"><h3>On the job</h3><p>P/T - SH/SC - wire drop - Ohm's - 608 - airflow</p></button>
        <button class="mode-card" data-mode="quiz" type="button"><h3>All-Star Exam</h3><p>EPA / electrical / charge questions - pass the bay</p></button>
        <button class="mode-card" data-mode="electrical" type="button"><h3>Follow the call</h3><p>Ladder - 24V path - land the lugs</p></button>
        <button class="mode-card" data-mode="defusal" type="button"><h3>Saturday callback</h3><p>No-cool sheet - meter first - isolate the open</p></button>
        <button class="mode-card" data-mode="service" type="button"><h3>Service calls</h3><p>Hook gauges - read SH/SC - pick the fault</p></button>
        <button class="mode-card" data-mode="minisplit" type="button"><h3>Mini-split install</h3><p>Flare - vacuum - weigh-in - line-set path</p></button>
        <button class="mode-card" data-mode="boardcodes" type="button"><h3>Board-code locker</h3><p>Door sticker is law — Carrier / Trane / mini-split letters</p></button>
        <button class="mode-card" data-mode="prove" type="button"><h3>PS prove path</h3><p>Hose/trap → vent → inducer → switch LAST</p></button>
        <button class="mode-card" data-mode="soo" type="button"><h3>Furnace SOO</h3><p>W → inducer → PS → ignitor → valve → µA → blower</p></button>
        <button class="mode-card" data-mode="float" type="button"><h3>Float prove</h3><p>Call → 240 → R–C → Y → HPC → LPC → float → coil</p></button>
        <button class="mode-card" data-mode="film" type="button"><h3>Component film</h3><p>Rex · scroll · oil · gas · hydronic</p></button>
        <button class="mode-card" data-mode="shoplabs" type="button"><h3>Lab packets</h3><p><span class="lincoln-only">Plywood wall · Lincoln catalog · filler</span><span class="store-only">Plywood electrical wall · 90-min bays</span></p></button>
        <button class="mode-card" data-mode="epa608" type="button"><h3>EPA 608 tutor</h3><p>Core / I / II / III - recovery law</p></button>
        <button class="mode-card" data-mode="commandments" type="button"><h3>HVAC Commandments</h3><p>Shop rules that keep you from a callback</p></button>
        <button class="mode-card" data-mode="elguide" type="button"><h3>Land lugs</h3><p>L1 LINE / L2 LINE / HERM / C R S - chips LEFT</p></button>
        <button class="mode-card" data-mode="rapture" type="button"><h3>HVAC Jesus</h3><p>Work clothes - roof racks - recovery tank</p></button>
      </div>
    </section>
    <section id="screen-electrical" class="screen"><div id="electrical-root"></div></section>
    <section id="screen-sandbox" class="screen"><div id="sandbox-root"></div></section>
    <section id="screen-truck-pouch" class="screen"><div id="truck-pouch-root"></div></section>
    <section id="screen-minisplit" class="screen"><div id="minisplit-root"></div></section>
    <section id="screen-quiz" class="screen"><div id="quiz-root"></div></section>
    <section id="screen-service" class="screen">
      <header class="hub-head">
        <h2 id="svc-title">On site</h2>
        <span id="svc-score"></span>
        <span id="svc-rating"></span>
        <button class="btn" id="btn-svc-hub" type="button">Shop floor</button>
      </header>
      <div class="panel svc-card" style="margin:12px;max-width:720px">
        <p class="eyebrow" id="svc-eyebrow">Service call</p>
        <div id="svc-avatar" style="font-size:2rem"></div>
        <h3 id="svc-name"></h3>
        <p id="svc-job"></p>
        <p id="svc-quote"></p>
        <p id="svc-vitals"></p>
        <p id="svc-prompt"></p>
        <div class="svc-route-btns" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
          <button class="btn primary" id="svc-hook" type="button">Hook gauges</button>
          <button class="btn" id="svc-next-ticket" type="button">Next random ticket</button>
        </div>
        <p id="svc-pay" class="sb-live" style="font-size:12px;opacity:.85"></p>
        <div id="svc-choices"></div>
        <p id="svc-feedback" class="svc-feedback"></p>
      </div>
    </section>
    <section id="screen-film" class="screen"><div id="film-root"></div></section>
    <section id="screen-shoplabs" class="screen"><div id="shoplabs-root"></div></section>
    <section id="screen-epa608" class="screen"><div id="epa608-root"></div></section>
    <section id="screen-commandments" class="screen"><div id="commandments-root"></div></section>
    <section id="screen-rapture" class="screen"><img src="jesus.png" alt="HVAC Jesus" /><p id="rapture-copy"></p><button class="btn" id="btn-rapture-hub">Shop floor</button></section>
    <p class="version-strip">HVAC Allstars - v3.5.169 - shop floor</p>
  </div>

  <script>
    (function () {
      var phone = false;
      try { phone = !!(window.matchMedia && window.matchMedia("(max-width:480px)").matches); } catch (_) {}
      window.LtElectricalPhone = window.LtElectricalPhone || {};
      function add(src) {
        document.write('<script src="' + src + '"><\\/script>');
      }
      if (phone) {
        window.LtElectricalPhone.deferFat = true;
        window.LtElectricalPhone.lite = true;
        add("electrical-lite.js?v=8");
        add("electrical-phone.js?v=5");
      } else {
        add("electrical.js?v=137");
        add("electrical-fat.js?v=4");
        add("electrical-phone.js?v=5");
      }
      add("electrical-sheet.js?v=4");
    })();
  </script>

  <script>
    window.ltGo = function (id) {
      if ((id === "hub" || id === "shop" || id === "floor") && typeof window.ltGoHub === "function") {
        window.ltGoHub();
        return;
      }
      document.querySelectorAll(".screen").forEach(function (s) {
        s.classList.remove("active");
        s.classList.remove("screen-on");
      });
      try { document.body.classList.remove("lab-open"); } catch (_) {}
      var el = document.getElementById("screen-" + id);
      if (el) {
        el.classList.add("active");
        el.classList.add("screen-on");
      }
    };
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=397").catch(function () {});
    if (!window.LtFilm) {
      var s = document.createElement("script");
      s.src = "film.js?v=7";
      document.body.appendChild(s);
    }
  </script>
