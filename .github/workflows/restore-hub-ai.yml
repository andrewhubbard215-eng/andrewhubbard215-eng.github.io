name: restore-hub-ai
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-hub-ai.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore hub-ai.js from known-good teaching-lock source
        run: |
          # Prefer assembled hex parts if complete; else restore patched blob from history tip before placeholder damage
          set -e
          if [ -d .github/hub-restore ] && [ "$(ls .github/hub-restore/h*.hex 2>/dev/null | wc -l)" -ge 32 ]; then
            python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path('.github/hub-restore').glob('h*.hex'))
          hx = ''.join(p.read_text().strip() for p in parts)
          data = bytes.fromhex(hx)
          Path('hub-ai.js').write_bytes(data)
          text = data.decode()
          assert 'dew point' in text and 'evap sat' not in text
          print('assembled_from_hex', len(text))
          PY
          else
            # Patched source was staged on teachlocks; fall back to last full tip blob before placeholder commits
            git show 1437df1:hub-ai.js > hub-ai.js
            python3 - <<'PY'
          from pathlib import Path
          c = Path('hub-ai.js').read_text()
          print('restored_1437df1', len(c), 'has_file', True)
          assert len(c) > 50000
          PY
          fi
      - name: Commit hub-ai.js
        run: |
          git config user.name "andrewhubbard215-eng"
          git config user.email "andrewhubbard215@gmail.com"
          git add hub-ai.js
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "Allstars: restore hub-ai.js (teaching-lock source or pre-placeholder tip)"
          git push
