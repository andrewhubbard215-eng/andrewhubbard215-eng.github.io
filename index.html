<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
  (function () {
    var APP_VER = "v3.5.457"; /* ONE version source: every footer reads <meta name="lt-app-ver"> */
    window.LT_APP_VER = APP_VER;
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/19929303c1ba1e1a0a9063add9063123282320a2/index.html";
    function patch(html) {
      html = html.replace(/sandbox-eq\.js\?v=\d+/g, "sandbox-eq.js?v=7");
      html = html.replace(/shop-floor-copy\.js\?v=\d+/g, "shop-floor-copy.js?v=69");
      // patch continues as original
      return html;
    }
    fetch(SRC, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("boot fetch " + r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(patch(html));
        document.close();
      })
      .catch(function (e) {
        document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - " + APP_VER + " - shop floor</p>";
      });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=700").catch(function () {});
  })();
  </script>
</head>
<body>
  <p style="font:16px/1.4 sans-serif;padding:24px;color:#f4e7c8;background:#0c0a07;min-height:80vh">Loading HVAC Allstars shop floor…</p>
  <p class="version-strip">HVAC Allstars - v3.5.457 - shop floor</p>
</body>
</html>
