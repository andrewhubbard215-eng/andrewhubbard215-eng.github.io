<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab packet</title>
  <script src="sku.js?v=13"></script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #efe8d8; color: #1a1714; font: 15px/1.45 "IBM Plex Sans", Georgia, serif; }
    #bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #1a1714; }
    #bar .btn { color: #efe8d8; border: 1px solid #efe8d8; background: transparent; padding: 8px 12px; text-decoration: none; font: 13px/1 sans-serif; cursor: pointer; }
    #bar .btn.primary { background: #efe8d8; color: #1a1714; }
    .lab-sheet { max-width: 720px; margin: 16px auto 48px; background: #fff; color: #111; padding: 28px 32px; }
    .lab-sheet h1, .lab-sheet h2, .lab-sheet h3 { font-family: Oswald, Impact, sans-serif; letter-spacing: .04em; }
    .lab-sheet h1 { font-size: 1.8rem; margin: 4px 0 8px; }
    .lab-sheet h2 { font-size: 1.15rem; margin: 22px 0 8px; }
    .lab-sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lab-sheet th, .lab-sheet td { border: 1px solid #444; padding: 6px 8px; height: 28px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; }
    .copy-banner { border: 2px solid #111; padding: 8px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
    .lab-inst { border: 2px solid #111; padding: 12px; margin: 12px 0; background: #f3eee3; break-inside: avoid; }
    .lab-hold { margin: 6px 0 0; padding-left: 8px; border-left: 2px solid #111; font-size: 12px; text-transform: uppercase; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .blank { border-bottom: 1px solid #999; height: 28px; }
    .muted { font-size: 12px; color: #555; }
    .map-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 4px; }
    .map-cell { border: 1px solid #111; padding: 10px 6px; text-align: center; font-size: 12px; }
    @media print {
      #bar { display: none !important; }
      body { background: #fff; }
      .lab-sheet { margin: 0; max-width: none; box-shadow: none; }
      a { color: inherit; text-decoration: none; }
    }
    @media (max-width: 640px) { .two { grid-template-columns: 1fr; } .lab-sheet { margin: 8px; padding: 16px; } }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="sheet"></div>
  <script src="shop-labs-data.js?v=3"></script>
  <script src="shop-labs-print.js?v=1"></script>
</body>
</html>
