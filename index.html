<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
  (function () {
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/19929303c1ba1e1a0a9063add9063123282320a2/index.html";
    function patch(html) {
      html = html.replace(/phone-p0\.css\?v=13/g, "phone-p0.css?v=14");
      html = html.replace(/v3\.5\.\d+/g, "v3.5.299");
      html = html.replace(/sw\.js\?v=5[0-9][0-9]/g, "sw.js?v=536");
      html = html.replace(/shop-floor-copy\.js\?v=\d+/g, "shop-floor-copy.js?v=49");
      html = html.replace(/sandbox-td\.js\?v=\d+/g, "sandbox-td.js?v=8");
      html = html.replace(/sandbox-packs\.js\?v=\d+/g, "sandbox-packs.js?v=2");
      html = html.replace(/sandbox-hunt\.js\?v=\d+/g, "sandbox-hunt.js?v=3");
      if (html.indexOf("sandbox-hunt.js") === -1) {
        html = html.replace("</body>", '<script src="sandbox-hunt.js?v=3"><\/script>\n</body>');
      }
      html = html.replace(/service\.js\?v=\d+/g, "service.js?v=109");
      html = html.replace(/electrical-lite\.js\?v=\d+/g, "electrical-lite.js?v=10");
      html = html.replace(/clock-in-form\.js\?v=\d+/g, "clock-in-form.js?v=32");
      html = html.replace(/clock-in-fix\.js\?v=\d+/g, "clock-in-fix.js?v=32");
      html = html.replace(/epa-exam-bank\.js\?v=\d+/g, "epa-exam-bank.js?v=7");
      html = html.replace(/lugs-lock\.js\?v=\d+/g, "lugs-lock.js?v=2");
      html = html.replace(/clock-in-floor\.js\?v=4[6-8]/g, "clock-in-floor.js?v=48");
      html = html.replace(/analog-gauges\.js\?v=\d+/g, "analog-gauges.js?v=8");
      html = html.replace(/refrigerant-flow\.js\?v=\d+/g, "refrigerant-flow.js?v=2");
      html = html.replace(
        /Meter leads \u00b7 airflow before charge \u00b7 no jump safety/g,
        "Hook gauges - read SH/SC - pick the fault"
      );
      if (html.indexOf("theme-amber-bench.css") === -1) {
        html = html.replace(
          '</head>',
          '  <link rel="stylesheet" href="theme-amber-bench.css?v=2" />\n  <link rel="stylesheet" href="exam-epa.css?v=2" />\n</head>'
        );
      } else {
        html = html.replace(/theme-amber-bench\.css\?v=\d+/g, "theme-amber-bench.css?v=2");
        if (html.indexOf("exam-epa.css") === -1) {
          html = html.replace('</head>', '  <link rel="stylesheet" href="exam-epa.css?v=2" />\n</head>');
        }
      }
      html = html.replace(/\s*<link rel="stylesheet" href="phone-gauges-233\.css\?v=\d+" \/>/g, "");
      html = html.replace(/\s*<link rel="stylesheet" href="phone-gauges-clip-233\.css\?v=\d+" \/>/g, "");
      html = html.replace(
        '</head>',
        '  <link rel="stylesheet" href="phone-gauges-233.css?v=5" />\n  <link rel="stylesheet" href="phone-gauges-clip-233.css?v=4" />\n</head>'
      );
      html = html.replace(/recovery-room\.js\?v=\d+/g, "recovery-room.js?v=7");
      html = html.replace(/recovery-room\.css\?v=\d+/g, "recovery-room.css?v=4");
      html = html.replace(/recovery-room\.g(\d)\.js\?v=\d+/g, "recovery-room.g$1.js?v=4");
      html = html.replace(/svc-ticket-match\.js\?v=\d+/g, "svc-ticket-match.js?v=2");
      html = html.replace(/route-ticket-gauges\.js\?v=\d+/g, "route-ticket-gauges.js?v=2");
      if (html.indexOf("service-meter.js") === -1) {
        html = html.replace(
          '<script src="recovery-room.js?v=7"><\/script>',
          '<script src="recovery-room.js?v=7"><\/script>\n  <script src="service-meter.js?v=1"><\/script>\n  <script src="svc-ticket-match.js?v=2"><\/script>'
        );
      }
      if (html.indexOf("svc-ticket-match.js") === -1) {
        html = html.replace(
          '<script src="service-meter.js?v=1"><\/script>',
          '<script src="service-meter.js?v=1"><\/script>\n  <script src="svc-ticket-match.js?v=2"><\/script>'
        );
      }
      if (html.indexOf("refrigerant-flow.js") === -1) {
        html = html.replace(
          '<script src="analog-gauges.js?v=8"><\/script>',
          '<script src="analog-gauges.js?v=8"><\/script>\n  <script src="refrigerant-flow.js?v=2"><\/script>'
        );
      }
      if (html.indexOf("land-lugs-route.js") === -1) {
        html = html.replace(
          '<script src="clock-in-form.js',
          '<script src="land-lugs-route.js?v=2"><\/script>\n  <script src="clock-in-form.js'
        );
      }
      if (html.indexOf("epa-exam-bank.js") === -1) {
        html = html.replace(
          '<script src="clock-in-form.js?v=32"><\/script>',
          '<script src="epa-exam-bank.js?v=7"><\/script>\n  <script src="exam-epa.js?v=2"><\/script>\n  <script src="clock-in-form.js?v=32"><\/script>'
        );
      }
      if (html.indexOf('href="/desk/"') === -1) {
        html = html.replace(
          '<button class="mode-card" data-mode="rapture"',
          '<a class="mode-card" href="/desk/" id="hub-desk-door"><h3>Instructor Desk</h3><p>Separate door \u2014 students stay on the shop floor</p></a>\n        <button class="mode-card" data-mode="rapture"'
        );
      }

      if (html.indexOf("exam-cutout.js") === -1) {
        html = html.replace(
          "</body>",
          '<script src="exam-cutout.js?v=4"><\/script>\n</body>'
        );
      } else {
        html = html.replace(/exam-cutout\.js\?v=\d+/g, "exam-cutout.js?v=4");
      }
      html = html.replace(/phone-gauges-233\.css\?v=\d+/g, "phone-gauges-233.css?v=5");
      html = html.replace(/phone-gauges-clip-233\.css\?v=\d+/g, "phone-gauges-clip-233.css?v=4");
      if (html.indexOf("route-ticket-gauges.js") === -1) {
        html = html.replace(
          "</body>",
          '<script src="route-ticket-gauges.js?v=2"><\/script>\n</body>'
        );
      }
      if (html.indexOf("sat-lines.js") === -1) {
        html = html.replace(
          "</body>",
          '<script src="sat-lines.js?v=1"><\/script>\n</body>'
        );
      }
      if (html.indexOf("sandbox-charge-print.js") === -1) {
        html = html.replace(
          "</body>",
          '<script src="sandbox-charge-print.js?v=4"><\/script>\n</body>'
        );
      }
      return html;
    }
    fetch(SRC, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("boot fetch " + r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(patch(html));
        document.close();
      })
      .catch(function (e) {
        document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - v3.5.299 - shop floor</p>";
      });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=536").catch(function () {});
  })();
  </script>
</head>
<body>
  <p style="font:16px/1.4 sans-serif;padding:24px;color:#f4e7c8;background:#0c0a07;min-height:80vh">Loading HVAC Allstars shop floor…</p>
  <p class="version-strip">HVAC Allstars - v3.5.299 - shop floor</p>
</body>
</html>
