<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script>
  (function () {
    var APP_VER = "v3.5.597"; /* ONE version source: every footer reads <meta name="lt-app-ver"> */
    window.LT_APP_VER = APP_VER;
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/19929303c1ba1e1a0a9063add9063123282320a2/index.html";
    function patch(html) {
      html = html.replace(/sandbox-eq\.js\?v=\d+/g, "sandbox-eq.js?v=7");
      html = html.replace(/sandbox-hook\.js\?v=\d+/g, "sandbox-hook.js?v=19");
      html = html.replace(/sandbox-layout\.css\?v=\d+/g, "sandbox-layout.css?v=44");
      html = html.replace(/sandbox-pc\.css\?v=\d+/g, "sandbox-pc.css?v=12");
      html = html.replace(/bay-restore\.js\?v=\d+/g, "bay-restore.js?v=2");
      html = html.replace(/sandbox-yell\.js\?v=\d+/g, "sandbox-yell.js?v=6");
      html = html.replace(/shop-floor-copy\.js\?v=\d+/g, "shop-floor-copy.js?v=202");
      html = html.replace(/sandbox-poster\.js\?v=\d+/g, "sandbox-poster.js?v=3");
      html = html.replace(/phone-p0\.css\?v=13/g, "phone-p0.css?v=14");
      html = html.replace(/v3\.5\.\d+/g, APP_VER);
      html = html.replace("<head>", '<head>\n  <meta name="lt-app-ver" content="' + APP_VER + '" />');
      html = html.replace(/electrical-sheet\.js\?v=\d+/g, "electrical-sheet.js?v=25");
      html = html.replace(/electrical\.js\?v=\d+/g, "electrical.js?v=139");
      html = html.replace(/nocool-lock\.js\?v=\d+/g, "nocool-lock.js?v=3");
      html = html.replace(/saturday-arm\.js\?v=\d+/g, "saturday-arm.js?v=3");
      html = html.replace(/sw\.js\?v=\d+/g, "sw.js?v=841");
      html = html.replace(/minisplit\.js\?v=\d+/g, "minisplit.js?v=11");
      html = html.replace(/minisplit-phone\.js\?v=\d+/g, "minisplit-phone.js?v=5");
      html = html.replace(/sandbox-seats\.js\?v=\d+/g, "sandbox-seats.js?v=34");
      html = html.replace(/route-park\.js\?v=\d+/g, "route-park.js?v=3");
      html = html.replace(/sandbox-td\.js\?v=\d+/g, "sandbox-td.js?v=8");
      html = html.replace(/sandbox-ts\.js\?v=\d+/g, "sandbox-ts.js?v=17");
      html = html.replace(/sandbox-packs\.js\?v=\d+/g, "sandbox-packs.js?v=3");
      html = html.replace(/sandbox-hunt\.js\?v=\d+/g, "sandbox-hunt.js?v=6");
      if (html.indexOf("sandbox-hunt.js") === -1) {
        html = html.replace("</body>", '<script src="sandbox-hunt.js?v=6"><\/script>\n</body>');
      }
      html = html.replace(/sandbox-fp\.js\?v=\d+/g, "sandbox-fp.js?v=28");
      html = html.replace(/sandbox-charge-print\.js\?v=\d+/g, "sandbox-charge-print.js?v=15");
      html = html.replace(/sandbox-cutout\.js\?v=\d+/g, "sandbox-cutout.js?v=9");
      if (html.indexOf("sandbox-cutout.js") === -1) {
        html = html.replace("</body>", '<script src="sandbox-cutout.js?v=9"><\/script>\n</body>');
      }
      if (html.indexOf("sandbox-fp.js") === -1) {
        html = html.replace("</body>", '<script src="sandbox-fp.js?v=28"><\/script>\n</body>');
      }
      return html;
    }
    fetch(SRC).then(function (r) { return r.text(); }).then(function (html) {
      document.open();
      document.write(patch(html));
      document.close();
    }).catch(function () {
      document.body.innerHTML = '<p>Load failed. Refresh.</p>';
    });
  })();
  </script>
</head>
<body>
  <p>Loading shop floor…</p>
  <script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=841").catch(function () {});
  </script>
  <p class="version-strip">HVAC Allstars - v3.5.597 - shop floor</p>
</body>
</html>
