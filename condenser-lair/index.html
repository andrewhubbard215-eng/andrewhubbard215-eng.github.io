<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#120c09" />
  <title>Condenser Lair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=Titan+One&display=swap" />
  <link rel="stylesheet" href="lair.css" />
</head>
<body>
  <main class="shell">
    <div class="cabinet" id="cab">
      <header class="marquee">
        <div class="bulbs" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <p class="tag">MOVE OR DIE</p>
        <h1>Condenser Lair</h1>
        <p class="fine"><a id="shop" href="../">Back to the shop</a></p>
      </header>
      <div id="hud"></div>
      <div class="bezel">
        <div class="screen">
          <img id="pic" class="pic is-alive" alt="" />
          <div class="motes"></div>
          <div class="sweep"></div>
          <div class="scan"></div>
          <div id="overlay"></div>
          <div id="wash" class="wash"></div>
        </div>
        <div class="meter" id="meter" hidden><span></span></div>
      </div>
      <p class="caption" id="caption"></p>
      <div id="deck"></div>
      <p id="live" class="sr-only" aria-live="assertive"></p>
    </div>
  </main>
  <script src="lair.js"></script>
</body>
</html>
