<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lincoln Tech HVAC Allstars</title>
  <script src="sku.js?v=10"></script>
  <link rel="stylesheet" href="style.css?v=139" />
  <link rel="stylesheet" href="board-codes.css?v=3" />
  <link rel="stylesheet" href="phone-floor.css?v=2" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div id="app">
    <section id="screen-title" class="screen active">
      <div class="bg-plate bg-lincoln" style="background-image:url(lincoln-tech.jpg)"></div>
      <div class="title-hero">
        <img src="hub-portrait.jpg" alt="Professor HUB" class="title-hero-face" />
        <p class="eyebrow"><span class="lincoln-only">Lincoln Tech · HVAC</span><span class="store-only">Vocational HVAC trainer</span></p>
        <h1>HVAC <span class="lt-red">Allstars</span></h1>
        <p class="lede">Clock In — shop floor.</p>
        <button class="btn primary btn-clock-hero" id="btn-start" type="button">Clock In</button>
      </div>
    </section>
    <section id="screen-hub" class="screen">
      <header class="hub-head">
        <img src="hub-portrait.jpg" alt="Professor HUB" class="hub-avatar" />
        <h2 id="hub-name">Tech</h2>
        <button type="button" class="btn" id="hub-locker">Locker</button>
        <button type="button" class="btn" data-hubai-toggle>HUB AI · On</button>
      </header>
      <div id="daily-root"></div>
      <div class="hub-grid hub-nav" id="hub-options">
        <button class="mode-card mode-card-hero" data-mode="sandbox" type="button"><h3>System sandbox</h3><p>Live SH/SC · parts stay LEFT</p></button>
        <button class="mode-card" data-mode="quiz" type="button"><h3>All-Star Exam</h3></button>
        <button class="mode-card" data-mode="electrical" type="button"><h3>Follow the call</h3><p>Ladder · 24V path · land the lugs</p></button>
        <button class="mode-card" data-mode="defusal" type="button"><h3>Saturday callback</h3><p>No-cool sheet · isolate the open</p></button>
        <button class="mode-card" data-mode="service" type="button"><h3>Service calls</h3></button>
        <button class="mode-card" data-mode="minisplit" type="button"><h3>Mini-split install</h3></button>
        <button class="mode-card" data-mode="boardcodes" type="button"><h3>Board-code locker</h3><p>Door sticker is law · prove path</p></button>
        <button class="mode-card" data-mode="epa608" type="button"><h3>EPA 608 tutor</h3></button>
        <button class="mode-card" data-mode="commandments" type="button"><h3>HVAC Commandments</h3></button>
        <button class="mode-card" data-mode="elguide" type="button"><h3>Land lugs</h3></button>
        <button class="mode-card" data-mode="rapture" type="button"><h3>HVAC Jesus</h3></button>
      </div>
    </section>
    <section id="screen-electrical" class="screen"><div id="electrical-root"></div></section>
    <section id="screen-sandbox" class="screen"><div id="sandbox-root"></div></section>
    <section id="screen-minisplit" class="screen"><div id="minisplit-root"></div></section>
    <section id="screen-quiz" class="screen"><div id="quiz-root"></div></section>
    <section id="screen-service" class="screen">
      <header class="hub-head">
        <h2 id="svc-title">On site</h2>
        <span id="svc-score"></span>
        <span id="svc-rating"></span>
        <button class="btn" id="btn-svc-hub" type="button">Shop floor</button>
      </header>
      <div class="panel" style="margin:12px;max-width:720px">
        <p class="eyebrow" id="svc-eyebrow">Service call</p>
        <div id="svc-avatar" style="font-size:2rem"></div>
        <h3 id="svc-name"></h3>
        <p id="svc-job"></p>
        <p id="svc-quote"></p>
        <p id="svc-vitals"></p>
        <p id="svc-prompt"></p>
        <div id="svc-choices"></div>
        <p id="svc-feedback" class="svc-feedback"></p>
      </div>
    </section>
    <section id="screen-epa608" class="screen"><div id="epa608-root"></div></section>
    <section id="screen-commandments" class="screen"><div id="commandments-root"></div></section>
    <section id="screen-rapture" class="screen"><img src="jesus.png" alt="HVAC Jesus" /><button class="btn" id="btn-rapture-hub">Shop floor</button></section>
    <p class="version-strip">HVAC Allstars · v3.5.13 · shop floor</p>
  </div>
  <script src="sku.js?v=10"></script>
  <script src="commandments.js?v=119"></script>
  <script src="epa608.js?v=1"></script>
  <script src="dragdrop.js?v=45"></script>
  <script src="electrical.js?v=129"></script>
  <script src="electrical-fat.js?v=2"></script>
  <script src="webgl-cycle.js?v=57"></script>
  <script src="sandbox.js?v=124"></script>
  <script src="sandbox-ts.js?v=4"></script>
  <script src="sandbox-hook.js?v=11"></script>
  <script src="sandbox-bom.js?v=2"></script>
  <script src="sandbox-fp.js?v=1"></script>
  <script src="minisplit.js?v=2"></script>
  <script src="service.js?v=98"></script>
  <script src="hub-ai.js?v=82"></script>
  <script src="quiz-arena.js?v=98"></script>
  <script src="board-codes.js?v=6"></script>
  <script src="daily.js?v=3"></script>
  <script src="game.js?v=202"></script>
  <script src="clock-in-fix.js?v=6"></script>
  <script src="shop-floor-copy.js?v=5"></script>
  <script>
    window.ltGo = function (id) {
      document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
      var el = document.getElementById("screen-" + id);
      if (el) el.classList.add("active");
    };
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=215").catch(function () {});
  </script>
</body>
</html>
