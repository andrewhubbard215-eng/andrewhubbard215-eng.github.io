<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0a" />
  <meta name="lt-app-ver" content="v3.5.748" />
  <title>Lincoln Tech HVAC Allstars</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script>
  (function () {
    var APP_VER = "v3.5.748"; /* ONE version source: every footer reads <meta name="lt-app-ver"> */
    window.LT_APP_VER = APP_VER;
    var SRC = "https://raw.githubusercontent.com/andrewhubbard215-eng/andrewhubbard215-eng.github.io/49ce6e5/index.html";
    function patch(html) {
      html = html.replace(/sandbox-eq\.js\?v=\d+/g, "sandbox-eq.js?v=14");
      html = html.replace(/sandbox-ts\.js\?v=\d+/g, "sandbox-ts.js?v=29");
      html = html.replace(/sw\.js\?v=\d+/g, "sw.js?v=995");
      html = html.replace(/shop-floor-copy\.js\?v=\d+/g, "shop-floor-copy.js?v=253");
      html = html.replace(/sandbox-seats\.js\?v=\d+/g, "sandbox-seats.js?v=34");
      html = html.replace(/sandbox-poster\.js\?v=\d+/g, "sandbox-poster.js?v=3");
      html = html.replace(/v3\.5\.\d+/g, APP_VER);
      html = html.replace(/HVAC Allstars - v3\.5\.\d+ - shop floor/g, "HVAC Allstars - " + APP_VER + " - shop floor \u00b7 Phone: hard-refresh for latest tips");
      return html;
    }
    function boot() {
      fetch(SRC).then(function (r) { return r.text(); }).then(function (html) {
        html = patch(html);
        document.open();
        document.write(html);
        document.close();
      }).catch(function (e) {
        document.body.innerHTML = "<p style='font:16px sans-serif;padding:24px'>HVAC Allstars boot failed. Hard-refresh. " + String(e) + "</p><p class='version-strip'>HVAC Allstars - " + APP_VER + " - shop floor \u00b7 Phone: hard-refresh for latest tips</p>";
      });
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=995").catch(function () {});
    boot();
  })();
  </script>
</head>
<body>
  <p class="version-strip">HVAC Allstars - v3.5.748 - shop floor \u00b7 Phone: hard-refresh for latest tips</p>
</body>
</html>
